# Pushing a version tag such as v0.1.0 publishes `pip install quireloop` and
# makes the matching GitHub release. Uses PyPI trusted publishing, so no PyPI
# password or token is stored here. One-time setup is in docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Check the release tag matches the version
        run: |
          version=$(node -p 'require("./server/package.json").version')
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: bash scripts/build-pypi.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: packaging/pypi/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Quireloop ${GITHUB_REF_NAME#v}" \
            --notes "Install with \`pip install quireloop==${GITHUB_REF_NAME#v}\`. See the [user guide](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/user-guide.md)."
