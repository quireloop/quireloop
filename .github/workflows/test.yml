# Runs the tests on the three systems a personal install supports. The server
# itself runs on Ubuntu; Windows and macOS are checked as local installs.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # LaTeX, so the compile and SyncTeX tests run rather than skip. macOS
      # goes without: a Mac install takes longest, and the compile tests skip
      # themselves when latexmk is missing.
      - name: Install LaTeX (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended
      # MiKTeX fetches packages on first use once AutoInstall is on; its
      # latexmk needs Perl, which the Windows runner already has.
      - name: Install LaTeX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install miktex --no-progress -y
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          & "$bin\initexmf.exe" --admin --set-config-value "[MPM]AutoInstall=1"
          & "$bin\miktex.exe" --admin packages update-package-database
          Add-Content $env:GITHUB_PATH $bin
      - run: npm ci
      - run: npm run build --workspace=web
      - run: npm test
        working-directory: server
      - name: Start the server and load the page
        shell: bash
        run: |
          cd server
          QUIRELOOP_DATA_DIR="$RUNNER_TEMP/ql-data" node src/start.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && { echo "server is up"; exit 0; }
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
